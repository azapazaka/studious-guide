<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Azapazaka | Interactive UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(79, 70, 229, 0); }
            100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0); }
        }
        .animate-pulse-custom { animation: pulse-border 2s infinite; }
    </style>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen overflow-hidden">
    
    <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/20 via-black to-purple-900/20 z-0"></div>

    <div class="relative z-10 p-10 border border-indigo-500/50 rounded-[2.5rem] bg-gray-900/80 backdrop-blur-xl shadow-2xl text-center max-w-sm transition-all hover:border-indigo-400">
        <div class="mb-6 text-6xl drop-shadow-lg">🚀</div>
        <h1 class="text-4xl font-black mb-1 tracking-tighter italic uppercase text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">
            Azapazaka
        </h1>
        <p class="text-indigo-300/70 font-mono text-xs mb-8 tracking-[0.2em]">SYSTEM DESIGNER // LVL 1</p>
        
        <div class="space-y-4">
            <div id="statusBox" class="p-4 bg-white/5 rounded-2xl border border-white/10 text-sm hover:bg-white/10 transition duration-300 cursor-default">
                📂 <span class="ml-2 italic text-gray-300">Studious Guide Project</span>
            </div>
            
            <button id="celebrateBtn" class="animate-pulse-custom w-full py-4 bg-indigo-600 rounded-2xl font-black uppercase tracking-widest text-xs hover:bg-indigo-500 transition-all active:scale-95 shadow-lg shadow-indigo-500/40">
                Сетевой этап хакатона
            </button>
        </div>
    </div>

    <script>
        const btn = document.getElementById('celebrateBtn');
        const status = document.getElementById('statusBox');

        btn.addEventListener('click', () => {
            // 1. Запускаем конфетти
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#6366f1', '#a855f7', '#ffffff']
            });

            // 2. Меняем текст в верхней плашке
            status.innerHTML = "🎉 <span class='ml-2 text-indigo-400 font-bold'>МЫ ПРОШЛИ!</span>";
            status.classList.add('border-indigo-500', 'bg-indigo-500/10');

            // 3. Меняем текст кнопки
            btn.textContent = "ПОБЕДА БУДЕТ ЗА НАМИ";
        });
    </script>
</body>
</html>
        </div>
    </div>
</body>
</html>
