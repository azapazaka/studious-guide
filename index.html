<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Azapazaka | Auth UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen font-sans">

    <div id="loginForm" class="relative z-10 p-8 border border-white/10 rounded-3xl bg-gray-900 shadow-2xl w-full max-w-sm transition-all duration-500">
        <h2 class="text-2xl font-bold mb-6 text-center italic uppercase tracking-widest">Вход в систему</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs text-gray-500 mb-1 ml-1 uppercase">Email</label>
                <input type="email" id="email" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl focus:outline-none focus:border-indigo-500 transition" placeholder="test@test.com">
            </div>
            <div>
                <label class="block text-xs text-gray-500 mb-1 ml-1 uppercase">Пароль</label>
                <input type="password" id="pass" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl focus:outline-none focus:border-indigo-500 transition" placeholder="••••••••">
            </div>
            
            <button id="signInBtn" class="w-full py-4 bg-indigo-600 rounded-xl font-black uppercase text-xs hover:bg-indigo-500 transition-all active:scale-95 shadow-lg shadow-indigo-500/20">
                Войти
            </button>
        </div>
        
        <p id="errorMsg" class="text-red-500 text-xs mt-4 text-center hidden italic"></p>
    </div>

    <div id="welcomeScreen" class="hidden text-center animate-bounce">
        <h1 class="text-5xl font-black mb-4">ДОБРО ПОЖАЛОВАТЬ! 🚀</h1>
        <p class="text-indigo-400">Доступ разрешен для Azapazaka</p>
    </div>

    <script>
        // Твои настройки Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBMsy_TlS5Z3uABWerMGYcfb3QyMZ6x8bY",
            authDomain: "hackathon-6323a.firebaseapp.com",
            projectId: "hackathon-6323a",
            storageBucket: "hackathon-6323a.firebasestorage.app",
            messagingSenderId: "1098870355380",
            appId: "1:1098870355380:web:9dbc57a3ee1"
        };

        // Инициализация
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const btn = document.getElementById('signInBtn');
        const form = document.getElementById('loginForm');
        const welcome = document.getElementById('welcomeScreen');
        const error = document.getElementById('errorMsg');

        btn.addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;

            error.classList.add('hidden');
            btn.innerText = "Загрузка...";
            btn.disabled = true;

            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    // Успех!
                    form.classList.add('opacity-0', 'scale-90');
                    setTimeout(() => {
                        form.classList.add('hidden');
                        welcome.classList.remove('hidden');
                    }, 500);
                })
                .catch((err) => {
                    // Ошибка
                    console.error("Код ошибки:", err.code);
                    btn.innerText = "Войти";
                    btn.disabled = false;
                    
                    error.innerText = "Ошибка: " + err.message;
                    error.classList.remove('hidden');
                    
                    form.classList.add('animate-pulse');
                    setTimeout(() => form.classList.remove('animate-pulse'), 500);
                });
        });
    </script>
</body>
</html>
